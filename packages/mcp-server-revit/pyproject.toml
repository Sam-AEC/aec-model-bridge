[project]
name = "aec-model-bridge"
version = "1.2.1"
description = "Independent Model Context Protocol integration for Autodesk Revit software"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "LICENSING.md", "LICENSES/*"]
authors = [
    { name = "Sam-AEC" },
]
keywords = ["mcp", "revit", "autodesk", "bim", "ai"]
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=1.3",
    "httpx>=0.24",
    "python-dotenv>=1.0",
    "mcp>=0.9.0",
    "ifcopenshell>=0.7.0",
    "networkx>=3.0",
    "specklepy>=3,<4",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    # agent_native.py replays response.content (incl. thinking blocks, which
    # Claude Opus 5 emits by default) back into history, and marks the tools
    # list with cache_control - pinned to the SDK version verified against both.
    "anthropic>=0.99",
]

[project.scripts]
aec-model-bridge = "revit_mcp_server.mcp_server:run_mcp_server"
revit-mcp-server = "revit_mcp_server.mcp_server:run_mcp_server"
aec-model-bridge-panel-server = "revit_mcp_server.panel_server:run_panel_server"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.0",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/Sam-AEC/aec-model-bridge"
Repository = "https://github.com/Sam-AEC/aec-model-bridge"
Issues = "https://github.com/Sam-AEC/aec-model-bridge/issues"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "e2e: marks Revit bridge end-to-end tests (opt in with AEC_MODEL_BRIDGE_E2E=1)",
    "perf: marks tests as performance benchmarks (deselect with '-m \"not perf\"')"
]

[tool.ruff.lint]
# Pin explicitly to ruff's own classic default rule set (pyflakes + basic
# pycodestyle). Newer ruff releases have changed what "default" means, and
# with the dependency unpinned (ruff>=0.0) that silently pulled in dozens of
# new rule categories (pyupgrade, bugbear, security, perf, ...) that were
# never adopted, breaking CI on every push without any code change.
select = ["E4", "E7", "E9", "F"]
