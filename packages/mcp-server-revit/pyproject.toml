[project]
name = "aec-model-bridge"
version = "1.6.2"
description = "Revit MCP server: 300+ tools to read and edit BIM and IFC models, every change human-approved."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "LICENSING.md", "LICENSES/*"]
authors = [
    { name = "Sam-AEC" },
]
keywords = ["mcp", "model-context-protocol", "revit", "autodesk", "bim", "ifc", "aec", "claude", "codex", "cursor", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=1.3",
    "httpx>=0.24",
    # Exclude trust stores affected by GHSA-6q48-6c7w-9gw2.
    "certifi>=2026.10.19",
    # Reject quadratic-time traceparent parsing (GHSA-mf5v-w3w3-f6cg).
    "opentelemetry-api>=1.45.2",
    "python-dotenv>=1.0",
    # 1.10 added Tool.title and Tool.annotations (readOnlyHint etc.), which
    # tool_metadata.py sets on every listed tool. Capped below 2: mcp 2.x removed the low-level `Server.list_tools()` decorators this server is
    # built on, so an unpinned install crashed at import time.
    "mcp>=1.30.0,<2",
    "ifcopenshell>=0.7.0",
    "networkx>=3.0",
    # Calendar-versioned SDK supports patched GraphQL dependencies.
    "specklepy>=2026.9.1,<2027",
    "graphql-core>=3.2.12",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    # agent_native.py replays response.content (incl. thinking blocks, which
    # Claude Opus 5 emits by default) back into history, and marks the tools
    # list with cache_control - pinned to the SDK version verified against both.
    "anthropic>=0.99",
]

[project.scripts]
aec-model-bridge = "revit_mcp_server.mcp_server:run_mcp_server"
revit-mcp-server = "revit_mcp_server.mcp_server:run_mcp_server"
aec-model-bridge-panel-server = "revit_mcp_server.panel_server:run_panel_server"
aec-model-bridge-approve = "revit_mcp_server.approve_cli:run"
aec-model-bridge-doctor = "revit_mcp_server.doctor:run"
aec-model-bridge-usage = "revit_mcp_server.usage_counts:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    # CI runs the suite with -n auto.
    "pytest-xdist>=3.6",
    # Property-based tests of the approval gate, safe paths and input validation (tests/test_property_*.py).
    "hypothesis>=6.100",
    # The wheel-contents test builds the package; CI also uses it for the sdist.
    "build>=1.2",
    "ruff>=0.0",
    "mypy>=1.8",
]

# IDS validation (ids_validator_validate_ifc): buildingSMART IDS checker from IfcOpenShell.
# ifctester 0.8.x fails against ifcopenshell 0.9 (no wrapped_data), so both stay on 0.8.x.
ids = ["ifctester>=0.8,<0.9", "ifcopenshell>=0.8,<0.9"]

[project.urls]
Homepage = "https://github.com/Sam-AEC/aec-model-bridge"
Repository = "https://github.com/Sam-AEC/aec-model-bridge"
Issues = "https://github.com/Sam-AEC/aec-model-bridge/issues"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# Module manifests, QA/QC rules and recipes are data files next to the code. Without
# this they were left out of the wheel, so a pip/uvx install silently lacked the
# ~80 module tools that a source checkout has.
[tool.setuptools.package-data]
revit_mcp_server = [
    # Sample tool-description catalogs (MCP_REVIT_LOCALE).
    "locales/*.json",
    "modules/*/module.json",
    "modules/*/rules/*.yaml",
    "modules/*/recipes/*.yaml",
    "modules/*/conventions/*.json",
    # IronPython 2.7 scripts that a module runs inside Revit (for example modules/revit/scripts).
    "modules/*/scripts/*.ipy",
    # Starter recipes of modules/revit_recipes (code + manifest).
    "modules/*/starter/*.ipy",
    "modules/*/starter/*.json",
    # Opt-in helper library for revit_execute_python (helpers=true).
    "python_helpers/*.ipy",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# -ra: summarise every non-passing outcome; --strict-markers: a typo'd marker
# fails instead of silently selecting nothing. Coverage is opt-in (--cov) so the
# stdio smoke test can also run against an installed wheel without pytest-cov.
addopts = ["-ra", "--strict-markers"]
# A hung subprocess or event loop must fail the test, not stall CI for hours
# (needs pytest-timeout from the dev extra; without it the key is only warned about).
timeout = 120
markers = [
    "timeout(seconds): per-test time limit (provided by pytest-timeout; registered so --strict-markers works without it)",
    "e2e: marks Revit bridge end-to-end tests (opt in with AEC_MODEL_BRIDGE_E2E=1)",
    "slow: builds a wheel (about 57 s); CI runs it on the primary leg only (deselect with '-m \"not slow\"')",
    "perf: marks tests as performance benchmarks (deselect with '-m \"not perf\"')",
    "xdist_group(name): keep the tests of one group on one xdist worker (needs --dist loadgroup; registered so --strict-markers works without xdist)",
]
# Later entries win. Warnings are errors, except: third-party deprecations (not
# ours to fix; they must not break CI), and resource leaks (unclosed files,
# sockets, sqlite handles) that predate this setting and are cleanup work.
# Deprecations raised from our own package stay errors.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "error::DeprecationWarning:revit_mcp_server",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# Mutation testing of the trust boundary (security/). Run by hand, not in CI; see
# .github/CONTRIBUTING.md "Property and mutation tests". mutmut is not a dependency:
#   uv run --with mutmut mutmut run      (Linux or macOS; mutmut needs fork)
[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/revit_mcp_server/security/*"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
pytest_add_cli_args_test_selection = [
    "tests/test_approval_gate.py",
    "tests/test_approval_modes.py",
    "tests/test_approval_override.py",
    "tests/test_approval_expiry_binding.py",
    "tests/test_approval_in_flight.py",
    "tests/test_approval_recovery.py",
    "tests/test_approval_v2.py",
    "tests/test_approval_v2_hardening.py",
    "tests/test_dev_mode.py",
    "tests/test_safe_paths.py",
    "tests/test_proof_and_revert.py",
    "tests/test_plan_gate_reachability.py",
    "tests/test_property_gate.py",
    "tests/test_property_safe_paths.py",
    "tests/test_property_input_fuzz.py",
]

[tool.coverage.run]
branch = true
# Include modules loaded by file path, not only the canonical package name.
source = ["src/revit_mcp_server"]
relative_files = true
# Child processes (python -m, stdio smoke tests) write their own data files; pytest-cov
# combines them at the end of a --cov run. Inactive when coverage is not running.
parallel = true
patch = ["subprocess"]
omit = ["*/tests/*", "*/_version.py"]

[tool.coverage.paths]
source = ["src/revit_mcp_server", "*/site-packages/revit_mcp_server"]

[tool.coverage.report]
# Measured at 87% (line + branch) with child processes included; the floor sits a few points below so
# platform differences do not break CI but a real drop does.
fail_under = 80
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff.lint]
# Pin explicitly to ruff's own classic default rule set (pyflakes + basic
# pycodestyle). Newer ruff releases have changed what "default" means, and
# with the dependency unpinned (ruff>=0.0) that silently pulled in dozens of
# new rule categories (pyupgrade, bugbear, security, perf, ...) that were
# never adopted, breaking CI on every push without any code change.
select = ["E4", "E7", "E9", "F"]
