# Smithery build/launch configuration. Runs the server from the root Dockerfile in
# MOCK mode: it starts and lists its tools without Autodesk Revit, using sample data.
# Live use needs Windows, Revit 2024 to 2027 and the AEC Model Bridge add-in. Install
# locally for that (see docs/install.md) and run with MCP_REVIT_MODE=bridge.
runtime: "container"
build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."
startCommand:
  type: "stdio"
  configSchema:
    type: "object"
    description: "Mock mode runs without Revit and returns sample data. Live use needs Windows, Revit 2024 to 2027 and the AEC Model Bridge add-in; install locally for that."
    properties:
      mode:
        type: "string"
        enum: ["mock", "bridge"]
        default: "mock"
        description: "mock: runs without Revit and returns sample data. bridge: talks to the AEC Model Bridge add-in in a running Revit; needs Windows, Revit 2024 to 2027 and the add-in."
      bridgeUrl:
        type: "string"
        default: ""
        description: "Leave empty: the server finds the running Revit by itself. Set a URL only to pin one add-in."
  commandFunction: |-
    (config) => ({
      command: "aec-model-bridge",
      args: [],
      env: {
        MCP_REVIT_MODE: config.mode || "mock",
        MCP_REVIT_BRIDGE_URL: config.bridgeUrl || "",
        MCP_REVIT_WORKSPACE_DIR: "/workspace",
        MCP_REVIT_ALLOWED_DIRECTORIES: "/workspace"
      }
    })
