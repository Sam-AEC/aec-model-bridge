# Example rule pack written as snapshot_compute pipelines.
# The first three rules are door-room-basics.yaml rewritten with `pipeline`; they find
# the same issues (tests/test_qaqc_pipeline_rules.py checks this on the mock snapshot).
# The last rule needs a join and a field-to-field comparison, which `filter` cannot express.
# Each row the pipeline returns is one issue. Keep `uid` in the rows.
# Copy it into your workspace, then: import_rule_pack -> run_check(rule_pack="door-room-pipeline")
rules:
  - id: door_mark_missing
    severity: error
    category: Doors
    description: "Door has no Mark. Every door must carry a unique door number."
    pipeline:
      - where:
          - {field: category, value: OST_Doors}
          - {field: params.Mark, op: empty}
    fix_template: "Set the Mark parameter on door '{label}'."

  - id: door_not_placed
    severity: warning
    category: Doors
    description: "Door is not placed in the model."
    pipeline:
      - where:
          - {field: category, value: OST_Doors}
          - {field: level_uid, op: exists, value: false}
          - {field: location, op: exists, value: false}
    fix_template: "Place or delete the unplaced door '{label}'."

  - id: room_number_missing
    severity: error
    category: Rooms
    description: "Room has no Number. Every room must carry a room number."
    pipeline:
      - where:
          - {field: category, value: OST_Rooms}
          - {field: params.Number, op: empty}
    fix_template: "Set the Number parameter on room '{label}'."

  - id: door_rating_below_wall
    severity: error
    category: Doors
    description: "Door fire rating is lower than the fire rating of its host wall."
    pipeline:
      - join: [host]
        where:
          - {field: category, value: OST_Doors}
          - {field: params.Fire Rating, op: lt, value: {field: host.params.Fire Rating}}
    fix_template: "Raise the fire rating of door '{label}' to match its host wall."
