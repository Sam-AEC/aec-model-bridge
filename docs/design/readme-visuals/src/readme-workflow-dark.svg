<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Inspect, Propose, Approve, Verify</title><desc id="d">Four steps: inspect finds an empty Mark, propose drafts a change, approve is a human decision, verify reads the value back. Example values are illustrative.</desc>
<rect id="background" width="1600" height="500" fill="#0D131B"/>
<text x="80" y="88" font-size="44" font-weight="700" fill="#E9EEF5">Inspect</text><rect x="80" y="130" width="312" height="220" rx="14" fill="#151D28" stroke="#2F3945" stroke-width="2"/><line x1="404" y1="240" x2="440" y2="240" stroke="#9BA8B9" stroke-width="3" stroke-linecap="round" /><path d="M430 231 L444 240 L430 249" fill="none" stroke="#9BA8B9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="456" y="88" font-size="44" font-weight="700" fill="#E9EEF5">Propose</text><rect x="456" y="130" width="312" height="220" rx="14" fill="#151D28" stroke="#2F3945" stroke-width="2"/><line x1="780" y1="240" x2="816" y2="240" stroke="#9BA8B9" stroke-width="3" stroke-linecap="round" /><path d="M806 231 L820 240 L806 249" fill="none" stroke="#9BA8B9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="832" y="88" font-size="44" font-weight="700" fill="#6FD8E6">Approve</text><rect x="832" y="130" width="312" height="220" rx="14" fill="#151D28" stroke="#1CB5CA" stroke-width="2"/><line x1="1156" y1="240" x2="1192" y2="240" stroke="#9BA8B9" stroke-width="3" stroke-linecap="round" /><path d="M1182 231 L1196 240 L1182 249" fill="none" stroke="#9BA8B9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1208" y="88" font-size="44" font-weight="700" fill="#E9EEF5">Verify</text><rect x="1208" y="130" width="312" height="220" rx="14" fill="#151D28" stroke="#2F3945" stroke-width="2"/><text x="80" y="432" font-size="28" font-weight="500" fill="#9BA8B9">Missing values become proposed changes. A person approves. Results are checked.</text><text id="footnote" x="80" y="472" font-size="22" font-weight="500" fill="#9BA8B9">Example values are illustrative.</text><text x="108" y="210" font-size="28" font-weight="600" fill="#E9EEF5">Door 0416</text><text x="364" y="210" font-size="28" font-weight="700" fill="#9BA8B9" text-anchor="end">D-102</text><rect x="96" y="248" width="280" height="56" rx="8" fill="rgba(242,166,60,0.16)" stroke="#F2A63C" stroke-width="2" stroke-dasharray="6 5"/><text x="108" y="285" font-size="28" font-weight="600" fill="#E9EEF5">Door 0417</text><text x="364" y="285" font-size="28" font-weight="700" fill="#F2A63C" text-anchor="end">empty</text><text x="484" y="200" font-size="28" font-weight="600" fill="#9BA8B9">Door 0417</text><text x="484" y="270" font-size="32" font-weight="600" fill="#F2A63C">empty</text><line x1="594" y1="258" x2="628" y2="258" stroke="#9BA8B9" stroke-width="3" stroke-linecap="round" /><path d="M618 249 L632 258 L618 267" fill="none" stroke="#9BA8B9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="648" y="270" font-size="32" font-weight="700" fill="#6FD8E6">D-103</text><text x="484" y="320" font-size="24" font-weight="500" fill="#9BA8B9">Draft, not applied</text><rect x="860" y="186" width="256" height="72" rx="12" fill="#1CB5CA"/><text x="988" y="234" font-size="34" font-weight="700" fill="#0B1118" text-anchor="middle">Approve</text><text x="988" y="306" font-size="28" font-weight="500" fill="#9BA8B9" text-anchor="middle">You decide</text><circle cx="1260" cy="220" r="26" fill="#3FCB8B"/><path d="M1249.08 220.52 L1257.4 228.84 L1271.96 211.16" fill="none" stroke="#151D28" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/><text x="1304" y="232" font-size="38" font-weight="700" fill="#E9EEF5">D-103</text><text x="1236" y="306" font-size="26" font-weight="500" fill="#9BA8B9">Read back</text>
</svg>
