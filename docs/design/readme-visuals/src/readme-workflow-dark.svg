<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Inspect, Propose, Approve, Verify</title><desc id="d">Four steps: inspect finds empty Mark values, propose drafts a change table, approve is a human decision, verify reads the values back. Example values are illustrative.</desc>
<rect id="background" width="1600" height="500" fill="#0D131B"/>
<circle cx="100" cy="64" r="20" fill="#1CB5CA"/><text x="100" y="72" font-size="24" font-weight="700" fill="#0B1118" text-anchor="middle">1</text><text x="132" y="77" font-size="38" font-weight="700" fill="#E9EEF5">Inspect</text><rect x="80" y="118" width="312" height="280" rx="14" fill="#151D28" stroke="#2F3945" stroke-width="2"/><text x="80" y="440" font-size="28" font-weight="500" fill="#9BA8B9">Find empty values</text><line x1="404" y1="258" x2="440" y2="258" stroke="#9BA8B9" stroke-width="3" stroke-linecap="round" /><path d="M430 249 L444 258 L430 267" fill="none" stroke="#9BA8B9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="476" cy="64" r="20" fill="#1CB5CA"/><text x="476" y="72" font-size="24" font-weight="700" fill="#0B1118" text-anchor="middle">2</text><text x="508" y="77" font-size="38" font-weight="700" fill="#E9EEF5">Propose</text><rect x="456" y="118" width="312" height="280" rx="14" fill="#151D28" stroke="#2F3945" stroke-width="2"/><text x="456" y="440" font-size="28" font-weight="500" fill="#9BA8B9">Draft a change table</text><line x1="780" y1="258" x2="816" y2="258" stroke="#9BA8B9" stroke-width="3" stroke-linecap="round" /><path d="M806 249 L820 258 L806 267" fill="none" stroke="#9BA8B9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="852" cy="64" r="20" fill="#1CB5CA"/><text x="852" y="72" font-size="24" font-weight="700" fill="#0B1118" text-anchor="middle">3</text><text x="884" y="77" font-size="38" font-weight="700" fill="#E9EEF5">Approve</text><rect x="832" y="118" width="312" height="280" rx="14" fill="#151D28" stroke="#1CB5CA" stroke-width="2"/><text x="832" y="440" font-size="28" font-weight="500" fill="#9BA8B9">A person decides</text><line x1="1156" y1="258" x2="1192" y2="258" stroke="#9BA8B9" stroke-width="3" stroke-linecap="round" /><path d="M1182 249 L1196 258 L1182 267" fill="none" stroke="#9BA8B9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1228" cy="64" r="20" fill="#1CB5CA"/><text x="1228" y="72" font-size="24" font-weight="700" fill="#0B1118" text-anchor="middle">4</text><text x="1260" y="77" font-size="38" font-weight="700" fill="#E9EEF5">Verify</text><rect x="1208" y="118" width="312" height="280" rx="14" fill="#151D28" stroke="#2F3945" stroke-width="2"/><text x="1208" y="440" font-size="28" font-weight="500" fill="#9BA8B9">Re-read and compare</text><text id="footnote" x="80" y="478" font-size="22" font-weight="500" fill="#9BA8B9">Example values are illustrative.</text><text x="104" y="164" font-size="24" font-weight="600" fill="#9BA8B9">Door · Mark</text><text x="106" y="211" font-size="24" font-weight="500" fill="#E9EEF5">Door 0415</text><text x="366" y="211" font-size="24" font-weight="500" fill="#9BA8B9" text-anchor="end">D-101</text><text x="106" y="261" font-size="24" font-weight="500" fill="#E9EEF5">Door 0416</text><text x="366" y="261" font-size="24" font-weight="500" fill="#9BA8B9" text-anchor="end">D-102</text><rect x="94" y="282" width="284" height="42" rx="6" fill="rgba(242,166,60,0.16)" stroke="#F2A63C" stroke-width="1.5" stroke-dasharray="5 4"/><text x="106" y="311" font-size="24" font-weight="500" fill="#E9EEF5">Door 0417</text><text x="366" y="311" font-size="24" font-weight="600" fill="#F2A63C" text-anchor="end">empty</text><rect x="94" y="332" width="284" height="42" rx="6" fill="rgba(242,166,60,0.16)" stroke="#F2A63C" stroke-width="1.5" stroke-dasharray="5 4"/><text x="106" y="361" font-size="24" font-weight="500" fill="#E9EEF5">Door 0418</text><text x="366" y="361" font-size="24" font-weight="600" fill="#F2A63C" text-anchor="end">empty</text><text x="480" y="164" font-size="24" font-weight="600" fill="#9BA8B9">Proposed changes</text><rect x="470" y="180" width="284" height="40" rx="6" fill="#1C2530"/><text x="482" y="207" font-size="22" font-weight="600" fill="#9BA8B9">Door</text><text x="568" y="207" font-size="22" font-weight="600" fill="#9BA8B9">Before</text><text x="742" y="20