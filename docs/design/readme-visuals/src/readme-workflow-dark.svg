1232" y="164" font-size="24" font-weight="600" fill="#9BA8B9">Read back values</text><text x="1234" y="223" font-size="26" font-weight="500" fill="#E9EEF5">0417</text><text x="1326" y="224" font-size="28" font-weight="700" fill="#E9EEF5">D-103</text><circle cx="1478" cy="214" r="15" fill="#3FCB8B"/><path d="M1471.7 214.3 L1476.5 219.1 L1484.9 208.9" fill="none" stroke="#151D28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="1222" y1="242" x2="1506" y2="242" stroke="#2F3945" stroke-width="1.5" stroke-linecap="round" /><text x="1234" y="279" font-size="26" font-weight="500" fill="#E9EEF5">0418</text><text x="1326" y="280" font-size="28" font-weight="700" fill="#E9EEF5">D-104</text><circle cx="1478" cy="270" r="15" fill="#3FCB8B"/><path d="M1471.7 270.3 L1476.5 275.1 L1484.9 264.9" fill="none" stroke="#151D28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="1222" y1="298" x2="1506" y2="298" stroke="#2F3945" stroke-width="1.5" stroke-linecap="round" /><rect x="1232" y="342" width="180" height="36" rx="18" fill="rgba(63,203,139,0.16)" stroke="#3FCB8B" stroke-width="1.5"/><text x="1248" y="367.7" font-size="22" font-weight="600" fill="#3FCB8B">2 of 2 match</text>
