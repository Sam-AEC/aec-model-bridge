<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo: assistant pane</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Source for the left pane of docs/images/readme/demo.gif. Frame is chosen with
   the URL hash, for example chat.html#f3. Run build_demo.py to rebuild the GIF. */
:root{--bg:#EEF2F6;--card:#FFFFFF;--ink:#13202B;--mute:#5C6B79;--line:#D3DCE4;--accent:#0A7F93;--red:#C62F1B;--ok:#17803D}
*{box-sizing:border-box}
html,body{margin:0;width:760px;height:584px;position:relative;background:var(--bg);font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);overflow:hidden}
.win{position:absolute;left:24px;top:24px;right:24px;bottom:0;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;display:flex;flex-direction:column}
.bar{height:46px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.bar small{font-weight:400;color:var(--mute);font-family:'IBM Plex Mono',monospace;font-size:12px}
.feed{flex:1;padding:22px 22px 18px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;overflow:hidden}
.msg{max-width:640px;font-size:17px;line-height:1.45}
.user{align-self:flex-end;background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px 14px 4px 14px}
.bot{align-self:flex-start;display:flex;flex-direction:column;gap:9px}
.chip{display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:#F6F8FA;align-self:flex-start}
.chip b{color:var(--ok);font-weight:600}
.text{font-size:17px}
.rows{border:1px solid var(--line);border-radius:8px;overflow:hidden;font-family:'IBM Plex Mono',monospace;font-size:14px;align-self:flex-start;min-width:430px}
.rows div{display:grid;grid-template-columns:1.3fr 1fr 22px 1fr;padding:7px 12px;border-top:1px solid var(--line)}
.rows div:first-child{border-top:0}
.rows .h{background:#F1F5F8;color:var(--mute);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.e{color:var(--red);font-style:italic}.arr{color:var(--accent)}.n{font-weight:600;color:var(--accent)}
.more{color:var(--mute)}
.done{display:flex;align-items:center;gap:14px;border:1.5px solid var(--ok);border-radius:10px;padding:12px 16px;align-self:flex-start;background:#F2FAF4}
.done .v{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600}
.done .v s{color:var(--red)}
.done small{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--mute)}
.sim{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:400;color:var(--mute)}
.hide{display:none}
</style>
</head>
<body>
<div class="win">
  <div class="bar">AI assistant <small>any MCP client</small><span class="sim">Example values. Simulated session.</span></div>
  <div class="feed" id="feed"></div>
</div>
<script>
var f = parseInt((location.hash || '#f1').slice(2), 10);
var feed = document.getElementById('feed');
function el(cls, html){ var d=document.createElement('div'); d.className=cls; d.innerHTML=html; feed.appendChild(d); return d; }
function chip(t, ok){ return '<span class="chip">'+t+(ok?' <b>done</b>':'')+'</span>'; }
el('msg user','Find the doors with no Mark and propose unique values.');
if (f >= 2) {
  el('msg bot', chip('qaqc_checker_run_check', true) +
    '<div class="text">12 doors have no Mark. I will draft a plan that sets D-101 to D-112.</div>');
}
if (f >= 3 && f < 5) {
  el('msg bot', chip('plan_actions', true) +
    '<div class="rows"><div class="h"><span>Element</span><span>Mark</span><span></span><span>Proposed</span></div>' +
    '<div><span>Door 412881</span><span class="e">empty</span><span class="arr">→</span><span class="n">D-101</span></div>' +
    '<div><span>Door 412904</span><span class="e">empty</span><span class="arr">→</span><span class="n">D-102</span></div>' +
    '<div><span>Door 413017</span><span class="e">empty</span><span class="arr">→</span><span class="n">D-103</span></div>' +
    '<div class="more"><span>+ 9 more</span><span></span><span></span><span></span></div></div>' +
    '<div class="text">Plan plan_7f3a is ready. Nothing changes until you approve it in Revit.</div>');
}
if (f >= 5) {
  el('msg bot', chip('plan_actions', true) +
    '<div class="text">Plan plan_7f3a: set Mark on 12 doors.</div>');
}
if (f >= 5) {
  el('msg bot', chip('execute_plan', true) +
    '<div class="text">Approved. Applied in one named transaction.</div>');
}
if (f >= 6) {
  el('msg bot', chip('revit_get_parameter_value × 12', true) +
    '<div class="text">Verified: 12 of 12 Marks match.</div>' +
    '<div class="done"><svg width="26" height="26" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#17803D"/><path d="M8.5 15.5l4.2 4.2 8.8-9.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
    '<div><small>DOOR · MARK</small><div class="v"><s>empty</s> <span style="color:#5C6B79">→</span> <span style="color:#0A7F93">D-101</span></div></div></div>');
}
</script>
</body>
</html>
