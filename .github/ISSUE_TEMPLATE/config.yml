# Forms record version, host and mode. Blank issues stay enabled because
# SUPPORT.md sends usage questions there. Security reports go elsewhere.
blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/Sam-AEC/aec-model-bridge/security/advisories/new
    about: Report security problems privately, never as a public issue. See SECURITY.md.
  - name: Installation or usage question
    url: https://github.com/Sam-AEC/aec-model-bridge/blob/main/.github/SUPPORT.md
    about: Where to ask, what to include, and what is supported. Run `aec-model-bridge doctor` first.
  - name: Troubleshooting guide
    url: https://github.com/Sam-AEC/aec-model-bridge/blob/main/docs/troubleshooting.md
    about: Known start-up, connection and add-in problems, with the log lines to look at.
  - name: How issues are written and labelled
    url: https://github.com/Sam-AEC/aec-model-bridge/blob/main/docs/issue-guide.md
    about: Title rules, labels, milestones and acceptance criteria.
  - name: MCP protocol or SDK problem
    url: https://github.com/modelcontextprotocol/python-sdk/issues
    about: Bugs that reproduce with the MCP Python SDK alone belong in that repository.
