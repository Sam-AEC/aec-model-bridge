name: Docs site

# Builds the MkDocs site with --strict on pull requests that touch the docs (not the
# folders mkdocs.yml excludes from the site), and
# deploys it to GitHub Pages on push to main. Pages must be set to
# Source: GitHub Actions once (docs/release-checklist.md, section 4).
on:
  pull_request:
    paths:
      - "docs/**"
      - "!docs/i18n/**"
      - "!docs/design/**"
      - "!docs/recipes/**"
      - "!docs/diagrams/**"
      - "mkdocs.yml"
      - "scripts/mkdocs_hooks.py"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "!docs/i18n/**"
      - "!docs/design/**"
      - "!docs/recipes/**"
      - "!docs/diagrams/**"
      - "mkdocs.yml"
      - "scripts/mkdocs_hooks.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs requirements
        run: python -m pip install --require-hashes -r docs/requirements.txt

      - name: Build site (strict)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write    # publish to GitHub Pages
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
