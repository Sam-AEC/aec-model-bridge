name: VS Code extension

on:
  pull_request:
    paths:
      - "extensions/vscode/**"
      - "scripts/version.py"
      - ".github/workflows/vscode-extension.yml"
  push:
    paths:
      - "extensions/vscode/**"
      - "scripts/version.py"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Node 24 ships npm 11. npm 10 (Node 20/22) crashes on this dependency tree
        # ("Cannot read properties of null (reading 'edgesOut')") and rejects package-lock.json.
        node: [24]
    defaults:
      run:
        working-directory: extensions/vscode

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

      - name: Upload .vsix
        if: matrix.node == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aec-model-bridge-vscode
          path: extensions/vscode/*.vsix
          if-no-files-found: error
