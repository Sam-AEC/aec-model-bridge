name: tag-release

# When a release PR (head dev or release/* of this repository) is merged into
# main, create the annotated tag v<VERSION> on the merge commit and start
# release.yml for it. A tag pushed with GITHUB_TOKEN does not trigger the tag
# push event, so the release is dispatched explicitly. Pushing a tag by hand
# still starts release.yml as before. Needs the GitHub Actions bypass entry in
# .github/rulesets/protect-tags.json (docs/release-checklist.md, section 4).
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.head.ref == 'dev' || startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout the merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Tag the merge commit and start the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION is not MAJOR.MINOR.PATCH; no tag created."
            exit 1
          fi
          tag="v${version}"
          if [ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]; then
            echo "::error::Checked out commit is not the merge commit; no tag created."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "Tag ${tag} already exists; nothing to do."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$tag" "$MERGE_SHA" -m "Release ${tag} (PR #${PR_NUMBER})"
          git push origin "refs/tags/${tag}"
          gh workflow run release.yml --ref "$tag" -f tag="$tag"
          echo "Created ${tag} and started release.yml."
