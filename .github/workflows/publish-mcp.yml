name: Publish MCP Server

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from the VERSION file at the checked-out ref, not from
      # the ref name, so this works for a release event, a manual run on main,
      # and the dispatch that release.yml fires for each stable tag.
      - name: Synchronize release artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          asset="aec-model-bridge-${version}.mcpb"
          gh release download "v${version}" --pattern "$asset" --dir release
          sha256="$(sha256sum "release/$asset" | cut -d' ' -f1)"
          python - "$version" "$sha256" <<'PY'
          import json
          import sys
          from pathlib import Path

          version, sha256 = sys.argv[1:]
          path = Path("server.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = version
          package = data["packages"][0]
          package["version"] = version
          package["identifier"] = (
              "https://github.com/Sam-AEC/aec-model-bridge/"
              f"releases/download/v{version}/aec-model-bridge-{version}.mcpb"
          )
          package["fileSha256"] = sha256
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      # Exact release, checked against a SHA-256 (upstream registry_1.8.16_checksums.txt
      # lists the same value). Bump MCP_PUBLISHER_VERSION and the checksum together, by hand.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.16"
          MCP_PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
        run: |
          curl -sSfL --retry 4 --retry-delay 5 -o "$RUNNER_TEMP/mcp-publisher.tar.gz"             "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
