name: OpenSSF Scorecard

# Supply-chain checks from the OpenSSF Scorecard. Results appear under
# Security -> Code scanning and on the public Scorecard site (publish_results).
# Scorecard only accepts published results when the job keeps to the actions
# and permissions below; do not add steps or top-level write permissions.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "41 5 * * 2" # Tuesdays 05:41 UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF to code scanning
      id-token: write        # sign the published results

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Fine-grained PAT with Administration: read, so the Branch-Protection check
          # can read the rulesets. Without the secret it falls back to the default token.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - name: Upload SARIF as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
