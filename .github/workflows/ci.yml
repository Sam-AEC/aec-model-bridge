name: Build and Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    # ready_for_review: a draft pull request skips the jobs below (see ci-success).
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
  # Nightly full matrix on the default branch, so a dependency release that breaks
  # an untested Python version shows up within a day.
  schedule:
    - cron: "17 3 * * *"

# Least privilege: every job below also states its own permissions explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Third-party and first-party actions are pinned by full commit SHA with a version
# comment; Dependabot (github-actions ecosystem) keeps them current.
jobs:
  # Decides which jobs this run needs. Pull requests and pushes to dev get a lean
  # matrix and skip the C# builds when no C# files changed; pushes to main, the
  # nightly run and manual runs get everything. Uses the API file list, so no
  # history checkout. A draft pull request runs none of the jobs.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.decide.outputs.python }}
      addin: ${{ steps.decide.outputs.addin }}
      rhino: ${{ steps.decide.outputs.rhino }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - name: Decide jobs and matrix
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          full='[{"os":"windows-latest","python-version":"3.11","primary":true},{"os":"windows-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.13"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"}]'
          lean='[{"os":"windows-latest","python-version":"3.11","primary":true},{"os":"ubuntu-latest","python-version":"3.13"}]'
          everything() {
            { echo "python=true"; echo "addin=true"; echo "rhino=true"; echo "matrix=$full"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          files="$RUNNER_TEMP/files.txt"
          : > "$files"
          if [ "$EVENT" = "pull_request" ]; then
            page=1
            while :; do
              batch="$(gh api "repos/$REPO/pulls/$PR/files?per_page=100&page=$page" --jq '.[].filename')"
              [ -z "$batch" ] && break
              printf '%s\n' "$batch" >> "$files"
              page=$((page + 1))
            done
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/dev" ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ]; then
            # Merge into dev: the pull request already ran, so the lean matrix is
            # enough. The compare API lists at most 300 files and fails on a
            # rewritten history; in both cases run everything.
            gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename' > "$files" || everything
            [ "$(wc -l < "$files")" -ge 300 ] && everything
          else
            everything
          fi
          echo "Changed files: $(wc -l < "$files")"
          ci='^\.github/workflows/ci\.yml$'
          addin_re="^packages/revit-bridge-addin|^scripts/build-addin\.ps1$|^Directory\.|^global\.json$|$ci"
          rhino_re="^packages/rhino-bridge-addin/|$ci"
          # Python tests also check README, docs, tool counts and the CHANGELOG, so
          # only a change confined to the C# add-in folders skips them.
          csharp_only='^packages/(revit-bridge-addin|revit-bridge-addin-tests|rhino-bridge-addin)/'
          has() { grep -Eq "$1" "$files" && echo true || echo false; }
          python=$(grep -Evq "$csharp_only" "$files" && echo true || echo false)
          [ -s "$files" ] || python=true
          {
            echo "python=$python"
            echo "addin=$(has "$addin_re")"
            echo "rhino=$(has "$rhino_re")"
            echo "matrix=$lean"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  python:
    name: python (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # uv installs from uv.lock with a cache keyed on it: the same versions on every
      # run, and seconds instead of a minute. The wheel smoke test below still
      # resolves from PyPI the way a user's pip install would.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: packages/mcp-server-revit/uv.lock

      # Forward-slash scratch paths: valid for Git Bash and native Windows programs
      # alike, and immune to MSYS path conversion of environment variables.
      - name: Resolve scratch paths
        run: |
          temp="$(python -c 'import os, pathlib; print(pathlib.Path(os.environ["RUNNER_TEMP"]).as_posix())')"
          {
            echo "REPORTS_DIR=${temp}/reports"
            echo "DIST_DIR=${temp}/dist"
            echo "CLEAN_VENV=${temp}/clean-venv"
            echo "COVERAGE_FILE=${temp}/reports/.coverage"
          } >> "$GITHUB_ENV"

      - name: Check version consistency
        run: python scripts/version.py check

      # Fails if uv.lock is stale (it once lacked a dependency and nothing noticed).
      - name: Install locked dependencies
        working-directory: packages/mcp-server-revit
        run: uv sync --locked --extra dev --extra ids

      - name: Run ruff
        working-directory: packages/mcp-server-revit
        run: uv run --no-sync ruff check src tests ../../scripts/ci_summary.py

      # Contributors add changes/<name>.md instead of editing CHANGELOG.md, and the
      # tool counts and llms-full.txt are generated, so these never conflict.
      - name: Check changelog fragments, tool counts and llms-full.txt
        if: matrix.primary
        run: |
          status=0
          python scripts/changelog.py check || status=1
          (cd packages/mcp-server-revit && uv run --no-sync python ../../scripts/sync_counts.py --check) || status=1
          python scripts/make_llms_full.py --check || status=1
          if [ "$status" -ne 0 ]; then
            echo "::error::Run 'python scripts/changelog.py check', 'python scripts/sync_counts.py' and 'python scripts/make_llms_full.py' (from packages/mcp-server-revit use 'uv run python ../../scripts/sync_counts.py'), then commit the result."
          fi
          exit "$status"

      # Not enforced: most of the tree predates ruff format. Reported so the size of
      # the gap stays visible; turn this into a hard check after a one-off reformat.
      - name: Report ruff format drift (not enforced)
        if: matrix.primary
        env:
          VENV_BIN: ${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}
        run: |
          count="$("packages/mcp-server-revit/.venv/${VENV_BIN}/ruff" format --check packages/mcp-server-revit/src packages/mcp-server-revit/tests 2>&1 | grep -c '^Would reformat' || true)"
          echo "ruff format would change ${count} files (not enforced)." | tee -a "$GITHUB_STEP_SUMMARY"

      # Run from the package directory: [tool.coverage.run] source is a relative path.
      # The two wheel-build tests (about 57 s each, marked slow) run on the primary
      # leg only; every other leg still builds and smoke-tests the wheel below.
      - name: Run Python tests with coverage
        working-directory: packages/mcp-server-revit
        env:
          PYTEST_MARKS: ${{ !matrix.primary && 'not slow' || '' }}
        run: |
          mkdir -p "$REPORTS_DIR"
          uv run --no-sync pytest tests -n auto -m "$PYTEST_MARKS" \
            --junitxml="$REPORTS_DIR/junit.xml" \
            --cov --cov-config=pyproject.toml \
            --cov-report=term \
            --cov-report="xml:$REPORTS_DIR/coverage.xml"

      - name: Summarise tests and coverage
        if: always()
        run: >
          python scripts/ci_summary.py
          --title "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
          --junit "$REPORTS_DIR/junit.xml"
          --coverage "$REPORTS_DIR/coverage.xml"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/reports/junit.xml
            ${{ runner.temp }}/reports/coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Check tool catalog generation
        if: matrix.primary
        run: |
          (cd packages/mcp-server-revit && uv run --no-sync python scripts/generate_tool_docs.py)
          git diff --exit-code docs/tools-generated.md

      - name: Validate repository metadata
        if: matrix.primary
        shell: pwsh
        run: |
          Get-Content server.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content packages/mcp-server-revit/manifest.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content .vscode/mcp.json -Raw | ConvertFrom-Json | Out-Null
          [xml](Get-Content packages/revit-bridge-addin/src/UI/ModernDialog.xaml -Raw) | Out-Null

      - name: Build wheel and sdist
        run: uv build packages/mcp-server-revit --out-dir "$DIST_DIR"

      - name: Check distribution metadata
        run: uvx twine==6.1.0 check --strict "$DIST_DIR"/*

      # The released artifact, not the source tree, is what users run. Install the
      # wheel into a fresh venv outside the checkout (so nothing resolves to ./src,
      # and dependencies are resolved from PyPI exactly as a user's install would)
      # and run the real stdio smoke test against it. This catches a server that
      # crashes at import under a newer dependency (mcp 2.x) and package data that
      # is missing from the wheel (module manifests, rules, recipes).
      - name: Install built wheel into a clean venv and smoke-test it
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$CLEAN_VENV"
          if [ "$RUNNER_OS" = "Windows" ]; then VPY="$CLEAN_VENV/Scripts/python.exe"; else VPY="$CLEAN_VENV/bin/python"; fi
          "$VPY" -m pip install --upgrade pip
          "$VPY" -m pip install "$DIST_DIR"/*.whl pytest pytest-timeout
          "$VPY" -m pip check
          "$VPY" -c "import revit_mcp_server, sys; print(revit_mcp_server.__file__); assert 'site-packages' in revit_mcp_server.__file__, 'not running the installed wheel'"
          "$VPY" -m pip list --format=freeze | grep -i -E '^(mcp|anthropic|pydantic|ifcopenshell|specklepy)=='
          AEC_SMOKE_PYTHON="$VPY" "$VPY" -m pytest "$GITHUB_WORKSPACE/packages/mcp-server-revit/tests/test_mcp_stdio_smoke.py" -p no:cacheprovider -v

      - name: Upload distributions
        if: matrix.primary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14

  addin:
    needs: changes
    if: needs.changes.outputs.addin == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        revit-version:
          - "2024"
          - "2025"
          - "2026"
          - "2027"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('packages/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build add-in
        shell: pwsh
        run: ./scripts/build-addin.ps1 -RevitVersion "${{ matrix.revit-version }}" -Configuration Release

      # Logic tests that need no Revit and no Autodesk assemblies (queue, read mode, paths, failure text).
      - name: Test add-in logic
        shell: pwsh
        run: dotnet test packages/revit-bridge-addin-tests -c Release -p:RevitVersion="${{ matrix.revit-version }}"

  rhino-addin:
    needs: changes
    if: needs.changes.outputs.rhino == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('packages/rhino-bridge-addin/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build Rhino bridge add-in
        shell: pwsh
        run: dotnet build packages/rhino-bridge-addin/RhinoBridge.csproj -c Release
        # RhinoCommon is a plain NuGet package (unlike the Navisworks/Autodesk
        # SDKs, which have no public NuGet distribution) — this needs no local
        # Rhino install and was previously never built in CI at all.

  # Fails fast on workflow typos, bad expressions and shell mistakes.
  workflow-lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rhysd/actionlint from its GitHub release, checked against a SHA-256, so the
      # job does not depend on Docker Hub (its token endpoint timed out and failed
      # CI). The runner already has shellcheck. Dependabot does not track this
      # version; bump ACTIONLINT_VERSION and the checksum together, by hand.
      - name: Lint workflows with actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL --retry 4 --retry-delay 5 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # CycloneDX SBOM of the Python package's locked runtime dependencies (uv.lock).
  # This lock inventory is distinct from the release SBOM of the shipped bundle.
  sbom:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CYCLONEDX_BOM_VERSION: "7.2.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Generate CycloneDX SBOM from uv.lock
        working-directory: packages/mcp-server-revit
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/sbom-requirements.txt"
          uvx --from "cyclonedx-bom==${CYCLONEDX_BOM_VERSION}" cyclonedx-py requirements "$RUNNER_TEMP/sbom-requirements.txt" \
            --pyproject pyproject.toml --sv 1.6 --of JSON --validate \
            -o "$RUNNER_TEMP/aec-model-bridge-lock.cdx.json"
          count="$(python -c 'import json, os, sys; print(len(json.load(open(sys.argv[1]))["components"]))' "$RUNNER_TEMP/aec-model-bridge-lock.cdx.json")"
          echo "CycloneDX SBOM generated with ${count} components." | tee -a "$GITHUB_STEP_SUMMARY"
          test "$count" -gt 0

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-lock-cyclonedx
          path: ${{ runner.temp }}/aec-model-bridge-lock.cdx.json
          if-no-files-found: error
          retention-days: 14

  # One stable name for branch protection: require "ci-success" instead of each
  # matrix leg, so adding or renaming a job never silently drops a required check.
  ci-success:
    name: ci-success
    if: always()
    needs:
      - changes
      - python
      - addin
      - rhino-addin
      - workflow-lint
      - sbom
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Require every needed job to have succeeded
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # A draft pull request runs no jobs. GitHub cannot merge a draft, and
          # marking it ready for review starts a full run that replaces this result.
          if [ "$DRAFT" = "true" ]; then
            echo "::notice::Draft pull request: checks are skipped until it is ready for review."
            exit 0
          fi
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # "skipped" is fine: the changes job skips jobs a pull request does not
          # touch. It must itself succeed, or everything would skip silently.
          if echo "$NEEDS_JSON" | jq -e '.changes.result != "success" or any(.[]; .result != "success" and .result != "skipped")' >/dev/null; then
            echo "::error::At least one required job failed or was cancelled."
            exit 1
          fi
