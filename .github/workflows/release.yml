name: Build GitHub Release

# Releases are cut by pushing a SemVer tag that matches the VERSION file:
#   python scripts/version.py bump minor   (or: set 1.3.0)
#   git commit -am "chore(release): 1.3.0" && git tag v1.3.0 && git push --follow-tags
# See docs/versioning.md. Tags with a hyphen (v1.3.0-rc.1) publish as pre-releases.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild, for example v1.3.0
        required: true
      revit_version:
        description: Revit version to package, or All for 2024-2027
        required: true
        default: "All"
      dry_run:
        description: Build and test everything, but do not create or update the GitHub release or start the registry publish. Artifacts are attached to the run instead.
        type: boolean
        required: false
        default: false
      ref:
        description: Git ref to build instead of the tag, for testing a branch. Only allowed together with dry_run.
        required: false
        default: ""

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
      id-token: write       # build provenance attestation
      attestations: write

    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } else { $env:INPUT_TAG }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '$tag' is not vMAJOR.MINOR.PATCH[-prerelease]" }
          if ($env:INPUT_REF -ne '' -and $env:INPUT_DRY_RUN -ne 'true') { throw "The ref input is only allowed together with dry_run, so a release is never built from an untagged ref." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          "prerelease=$($tag.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify tag, VERSION, manifests and changelog agree
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python scripts/version.py check --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Release metadata does not match the tag" }
          # Attestations identify the workflow event's commit, not an arbitrary checkout.
          # A manual publishing rebuild must be dispatched on the requested tag itself.
          $builtCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve the built commit" }
          if ($env:DRY_RUN -ne 'true' -and $builtCommit -ne $env:GITHUB_SHA) {
            throw "Publishing requires dispatching on $env:RELEASE_TAG so the attested commit matches the checkout. Use dry_run for a different ref."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Python build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade build pytest
          python -m pip install -e "packages/mcp-server-revit[dev]"

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest packages/mcp-server-revit/tests

      - name: Set up Node for the VS Code extension
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24   # npm 11; npm 10 cannot install the extension's dependencies
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Build and test the VS Code extension
        working-directory: extensions/vscode
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Extension dependency install failed" }
          npm run compile
          if ($LASTEXITCODE -ne 0) { throw "Extension compile failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Extension tests failed" }
          npm run package
          if ($LASTEXITCODE -ne 0) { throw "Extension packaging failed" }

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Build release artifacts
        shell: pwsh
        run: >
          ./scripts/build-release.ps1
          -Version "${{ steps.tag.outputs.version }}"
          -RevitVersion "${{ inputs.revit_version || 'All' }}"
          -VSCodePackage "extensions/vscode/aec-model-bridge-${{ steps.tag.outputs.version }}.vsix"

      # The double-click installer carries all four Revit years, so it needs the full package.
      - name: Install Inno Setup
        if: ${{ (inputs.revit_version || 'All') == 'All' }}
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }

      - name: Build Windows installer
        if: ${{ (inputs.revit_version || 'All') == 'All' }}
        shell: pwsh
        run: >
          ./scripts/build-installer.ps1
          -Version "${{ steps.tag.outputs.version }}"
          -SkipPackage
          -OutputDir dist/release
          -UpdateChecksums

      - name: Smoke-test the installer (silent install, upgrade, failure, uninstall)
        if: ${{ (inputs.revit_version || 'All') == 'All' }}
        shell: pwsh
        run: >
          ./scripts/test-installer.ps1
          -Installer "dist/release/AECModelBridge-Setup-${{ steps.tag.outputs.version }}.exe"
          -AllowOverwrite

      - name: Generate the shipped Python SBOM and refresh checksums
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $bundlePython = Join-Path $env:GITHUB_WORKSPACE 'dist/AECModelBridge/python/python.exe'
          $sbom = Join-Path $env:GITHUB_WORKSPACE "dist/release/aec-model-bridge-$env:RELEASE_VERSION.cdx.json"
          # The generator runs separately; it must not install itself into the shipped environment.
          uvx --from cyclonedx-bom==7.2.1 cyclonedx-py environment $bundlePython --pyproject packages/mcp-server-revit/pyproject.toml --sv 1.6 --of JSON --output-reproducible --validate -o $sbom
          if ($LASTEXITCODE -ne 0) { throw "Shipped environment SBOM generation failed" }
          python scripts/validate_release_sbom.py $sbom --python $bundlePython --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "SBOM does not match the shipped environment" }
          Get-ChildItem -Path dist/release -File |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object Name |
            ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content -LiteralPath dist/release/SHA256SUMS.txt -Encoding ascii

      - name: Write release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          python scripts/version.py notes $version | Out-File -Encoding utf8 release-notes.md
          if (Test-Path "dist/release/AECModelBridge-Setup-$version.exe") {
            Add-Content -Encoding utf8 release-notes.md @"

          **Easiest install:** download ``AECModelBridge-Setup-$version.exe`` below, double-click it and follow the wizard. It detects your Revit versions and sets everything up. Checksums are in ``SHA256SUMS.txt``. The shipped Python dependency inventory is ``aec-model-bridge-$version.cdx.json``; see docs/supply-chain.md for its scope and verification.
          "@
          }

      - name: Upload artifacts (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run-${{ steps.tag.outputs.version }}
          path: |
            dist/release/*
            release-notes.md
          if-no-files-found: error

      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*

      - name: Create or update GitHub release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag (Get-ChildItem dist/release/*).FullName --clobber
            gh release edit $tag --notes-file release-notes.md
          } else {
            $flags = @()
            if ('${{ steps.tag.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
            gh release create $tag (Get-ChildItem dist/release/*).FullName `
              --verify-tag --title "AEC Model Bridge $tag" --notes-file release-notes.md @flags
          }

      - name: Publish to the MCP Registry
        if: ${{ steps.tag.outputs.prerelease == 'false' && !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # A release created with the default token does not fire release-event workflows,
        # but workflow_dispatch does, so start the registry publish explicitly.
        run: gh workflow run publish-mcp.yml --ref "${{ steps.tag.outputs.tag }}"

      # Releases created with GITHUB_TOKEN do not trigger release-event workflows.
      - name: Start extension store publishing
        if: ${{ steps.tag.outputs.prerelease == 'false' && !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run vscode-extension.yml --ref $env:RELEASE_TAG -f "publish_tag=$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Extension publish dispatch failed" }
