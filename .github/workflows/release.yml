name: Build GitHub Release

# Releases are cut by pushing a SemVer tag that matches the VERSION file:
#   python scripts/version.py bump minor   (or: set 1.3.0)
#   git commit -am "chore(release): 1.3.0" && git tag v1.3.0 && git push --follow-tags
# See docs/versioning.md. Tags with a hyphen (v1.3.0-rc.1) publish as pre-releases.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild, for example v1.3.0
        required: true
      revit_version:
        description: Revit version to package
        required: true
        default: "2027"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } else { '${{ inputs.tag }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '$tag' is not vMAJOR.MINOR.PATCH[-prerelease]" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          "prerelease=$($tag.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify tag, VERSION, manifests and changelog agree
        shell: pwsh
        run: python scripts/version.py check --tag "${{ steps.tag.outputs.tag }}"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Python build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade build pytest
          python -m pip install -e packages/mcp-server-revit

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest packages/mcp-server-revit/tests

      - name: Build release artifacts
        shell: pwsh
        run: >
          ./scripts/build-release.ps1
          -Version "${{ steps.tag.outputs.version }}"
          -RevitVersion "${{ inputs.revit_version || '2027' }}"

      - name: Write release notes from CHANGELOG
        shell: pwsh
        run: python scripts/version.py notes "${{ steps.tag.outputs.version }}" | Out-File -Encoding utf8 release-notes.md

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag (Get-ChildItem dist/release/*).FullName --clobber
            gh release edit $tag --notes-file release-notes.md
          } else {
            $flags = @()
            if ('${{ steps.tag.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
            gh release create $tag (Get-ChildItem dist/release/*).FullName `
              --verify-tag --title "AEC Model Bridge $tag" --notes-file release-notes.md @flags
          }
