name: Fuzz (nightly)

# Runs the Hypothesis property tests (tests/test_property_*.py) with the deep "slow"
# profile: the approval gate state machine, path safety, input validation, and the
# panel hub /execute body parser and payload path check. No secrets, read-only token.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  property-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AEC_HYPOTHESIS_PROFILE: slow
      MCP_REVIT_MODE: mock
      UV_PYTHON: "3.13"
    defaults:
      run:
        shell: bash
        working-directory: packages/mcp-server-revit
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: packages/mcp-server-revit/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Hypothesis prints a @reproduce_failure line and the shrunk example for any failure.
      # The slow profile can take longer than the suite-wide 120 s per-test limit.
      - name: Run property tests (slow profile)
        run: uv run --no-sync pytest -q -p no:cacheprovider tests/test_property_*.py --timeout 1500 --hypothesis-show-statistics
