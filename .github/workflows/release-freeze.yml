name: release-freeze

# dev is frozen while a release PR into main is open. Its head is dev or a
# release/* branch of this repository. Add `release-freeze`
# as a required check on dev (docs/release-checklist.md, section 0).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev]

permissions: {}

jobs:
  release-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Fail while a release PR is open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # A release PR is open when its head is dev or a release/* branch of this
          # repository. A fork branch with the same name does not count.
          filter='.[] | select(.headRepositoryOwner.login == $owner and (.headRefName == "dev" or (.headRefName | startswith("release/")))) | .number'
          prs=$(gh pr list --base main --state open --limit 100 --json number,headRefName,headRepositoryOwner)
          open=$(printf '%s' "$prs" | jq -r --arg owner "${OWNER}" "$filter" | head -n 1)
          if [ -n "$open" ]; then
            echo "::error::dev is frozen: release PR #${open} into main is open. Merge or close it, then re-run this check."
            exit 1
          fi
          echo "No open release PR. dev is not frozen."
