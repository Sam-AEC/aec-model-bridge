name: Publish Python Package

# Publishes the wheel and sdist of packages/mcp-server-revit to PyPI with
# Trusted Publishing (OIDC, no API token). Builds always come from a stable tag.
#
# Triggers:
# - release.yml dispatches this workflow after it creates a non-prerelease GitHub
#   release. A release created with GITHUB_TOKEN does not fire release events,
#   so the dispatch is the normal path.
# - release: published covers a release created by hand or with another token.
# - workflow_dispatch with a tag rebuilds and publishes that tag by hand.
#
# One-time setup on pypi.org: see docs/release-checklist.md, section 7.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag to build and publish, for example v1.6.0
        required: true

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pre-releases are never published to PyPI.
    if: github.event_name != 'release' || !github.event.release.prerelease
    permissions:
      contents: read
      id-token: write       # build provenance attestation
      attestations: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Resolve and check the tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not a stable vMAJOR.MINOR.PATCH tag. Pre-releases are not published to PyPI."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Verify tag, VERSION and manifests agree
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: python scripts/version.py check --tag "$RELEASE_TAG"

      - name: Install build tooling
        run: |
          python -m pip install --require-hashes -r .github/requirements/publish.txt

      - name: Build wheel and sdist
        working-directory: packages/mcp-server-revit
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/mcp-server-revit/dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: packages/mcp-server-revit/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The PyPI trusted publisher is bound to this environment name.
    environment:
      name: pypi
      url: https://pypi.org/project/aec-model-bridge/
    permissions:
      id-token: write # Trusted Publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
