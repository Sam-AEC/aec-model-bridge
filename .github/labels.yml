# Label taxonomy for Sam-AEC/aec-model-bridge.
#
# Format: the list format read by crazy-max/ghaction-github-labeler and
# similar sync tools. `from_name` renames an existing label in place, so issues
# keep it. Colours are hex without '#'. Meanings and usage rules are in
# docs/issue-guide.md.
#
# Rules:
# - Every issue has exactly one `type:` label and at least one `area:` label.
# - Open issues that are accepted have one `priority:` label.
# - `status:` labels describe what the issue waits on. Remove them when the
#   wait is over.
# - Pull requests use `type:` and `area:` too; the `pr:` and ecosystem labels
#   are for pull requests only.

# ---- type: what kind of work (one per issue) ----
- name: "type: bug"
  color: "d73a4a"
  description: "Behaviour differs from the docs or from the stated design"
  from_name: "bug"
- name: "type: feature"
  color: "a2eeef"
  description: "New capability or a change to existing behaviour"
  from_name: "enhancement"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only; no behaviour change"
  from_name: "documentation"
- name: "type: task"
  color: "c5def5"
  description: "Maintenance, refactor, review or verification work with no new behaviour"
  from_name: "chore"
- name: "type: tech-debt"
  color: "bfd4f2"
  description: "Known shortcut or inconsistency in the code that should be paid down"
  from_name: "tech-debt"
- name: "type: tracking"
  color: "5319e7"
  description: "Tracking issue that groups other issues in a task list; closed when all are done"

# ---- area: which part of the system (one or more) ----
- name: "area: approval"
  color: "1d76db"
  description: "Plans, approval gate, execute_plan, proof bundles, binding and expiry"
- name: "area: security"
  color: "1d76db"
  description: "Path safety, workspace sandbox, redaction, audit log, CodeQL"
  from_name: "security"
- name: "area: server"
  color: "1d76db"
  description: "Python MCP server core (packages/mcp-server-revit) outside other areas"
  from_name: "mcp-server"
- name: "area: mcp"
  color: "1d76db"
  description: "MCP protocol features: transports, schemas, notifications, elicitation, completions"
- name: "area: addin"
  color: "1d76db"
  description: "C# Revit add-in (packages/revit-bridge-addin)"
  from_name: "revit"
- name: "area: panel"
  color: "1d76db"
  description: "Approval panel (panel/, WebView2)"
- name: "area: snapshot"
  color: "1d76db"
  description: "Snapshot producer in the add-in and the snapshot schema"
- name: "area: qa"
  color: "1d76db"
  description: "Rule packs, model checks and audit modules"
- name: "area: interop"
  color: "1d76db"
  description: "IFC, BCF, Excel, CSV, Power BI and clash report exchange"
- name: "area: modules"
  color: "1d76db"
  description: "Plug-in module system (modules/<id>/, module.json)"
- name: "area: install"
  color: "1d76db"
  description: "Installer, Windows bundle, launchers, doctor command, client configuration"
- name: "area: ci"
  color: "1d76db"
  description: "CI, release automation, benchmarks and evaluation harnesses"
  from_name: "ci"
- name: "area: docs"
  color: "1d76db"
  description: "Reference docs, ADRs, README and translations"

# ---- priority: how soon (one per accepted issue) ----
- name: "priority: P0"
  color: "b60205"
  description: "Wrong result shown as correct, security exposure, or data loss; fix before the next release"
  from_name: "P0"
- name: "priority: P1"
  color: "d93f0b"
  description: "Blocks the next release milestone"
  from_name: "P1"
- name: "priority: P2"
  color: "fbca04"
  description: "Planned; fix when the milestone allows"
  from_name: "P2"
- name: "priority: P3"
  color: "fef2c0"
  description: "Useful but not planned for a milestone"

# ---- size: rough effort ----
- name: "size: S"
  color: "ededed"
  description: "About a day or less; one module or file"
  from_name: "size/S"
- name: "size: M"
  color: "d4c5f9"
  description: "A few days; several files or one add-in command"
  from_name: "size/M"
- name: "size: L"
  color: "b4a7d6"
  description: "A week or more, or needs a design note first"
  from_name: "size/L"

# ---- status: what the issue waits on ----
- name: "status: triage"
  color: "ffffff"
  description: "New; type, area and priority not yet set"
- name: "status: needs-info"
  color: "d876e3"
  description: "Waiting on the reporter for version, logs or steps; closed after 14 days without reply"
  from_name: "question"
- name: "status: needs-repro"
  color: "d876e3"
  description: "Reported but not yet reproduced by a maintainer"
- name: "status: needs-design"
  color: "f9d0c4"
  description: "Approach must be settled in the issue or an ADR before code"
  from_name: "needs-owner-decision"
- name: "status: blocked"
  color: "b60205"
  description: "Waiting on another issue, PR or upstream change; link it in the body"
- name: "status: in-progress"
  color: "0e8a16"
  description: "Someone has claimed it and is working on it"
- name: "status: needs-live-verification"
  color: "fbca04"
  description: "Code is merged or ready; behaviour must be checked on Windows with a live Revit"
  from_name: "live-verification"
- name: "status: verified-live"
  color: "0e8a16"
  description: "Checked on a live Revit; result recorded in the issue with Revit version and commit"

# ---- contributor labels (GitHub surfaces these names, so they keep no prefix) ----
- name: "good first issue"
  color: "7057ff"
  description: "Small, mock-mode testable, with file paths and acceptance criteria in the body"
- name: "help wanted"
  color: "008672"
  description: "Accepted and open to outside contributors; comment before starting"

# ---- resolution: why an issue closed without a fix ----
- name: "resolution: duplicate"
  color: "cfd3d7"
  description: "Already tracked in another issue; linked in a comment"
  from_name: "duplicate"
- name: "resolution: wontfix"
  color: "ffffff"
  description: "Will not be done; the reason is in a comment"
  from_name: "wontfix"
- name: "resolution: invalid"
  color: "e4e669"
  description: "Not a problem with this project"
  from_name: "invalid"
- name: "resolution: as-designed"
  color: "ffffff"
  description: "Behaviour is intended and documented"

# ---- pull requests only ----
- name: "pr: needs-review"
  color: "fef2c0"
  description: "Needs a human review before merge"
  from_name: "needs-review"
- name: "pr: ready-to-merge"
  color: "0e8a16"
  description: "Checks green, diff reviewed, safe to merge"
  from_name: "ready-to-merge"
- name: "pr: conflicts"
  color: "b60205"
  description: "Merge conflicts with the base branch"
  from_name: "conflicts"
- name: "pr: tests"
  color: "0e8a16"
  description: "Adds or changes tests only"
  from_name: "tests"
- name: "pr: refactor"
  color: "fbca04"
  description: "Restructuring or performance work without behaviour change"
  from_name: "refactor"

# ---- ecosystem labels applied by Dependabot (names fixed by Dependabot) ----
- name: "dependencies"
  color: "0366d6"
  description: "Updates a dependency file"
- name: "python"
  color: "2b67c6"
  description: "Updates Python code or dependencies"
- name: "python:uv"
  color: "2b67c6"
  description: "Updates uv.lock"
- name: ".NET"
  color: "7121c6"
  description: "Updates .NET code or dependencies"
- name: "github_actions"
  color: "000000"
  description: "Updates GitHub Actions workflows"
- name: "javascript"
  color: "168700"
  description: "Updates JavaScript code or dependencies"

# Retired: `testing` (use `type: task` + `status: needs-live-verification`).
