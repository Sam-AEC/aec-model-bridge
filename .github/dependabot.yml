# Low-noise policy: routine version updates are monthly and grouped into ONE pull
# request per ecosystem. Security updates are separate and still arrive immediately
# (Settings -> Code security -> Dependabot security updates), so nothing important
# is lost by keeping the routine ones quiet.
version: 2
updates:
  - package-ecosystem: pip
    directory: /packages/mcp-server-revit
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # mcp 2.x removed the low-level Server decorators this server is built on,
      # so it crashes at import. Keep the cap in pyproject.toml until the server
      # is ported, then lift it by hand.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
      # specklepy is capped below 4 on purpose; a major needs a manual port.
      - dependency-name: specklepy
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]

  # The .NET add-ins compile against Revit, Rhino and Navisworks SDKs and ship
  # deliberate pins (IronPython 2.7 on net48, WebView2, RhinoCommon 7). Routine
  # version bumps here cost review time and carry real risk, so version updates
  # are off (limit 0). Security advisories still open their own pull requests.
  - package-ecosystem: nuget
    directory: /packages/revit-bridge-addin
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: nuget
    directory: /packages/rhino-bridge-addin
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: nuget
    directory: /packages/navisworks-bridge-addin
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: nuget
    directory: /packages/powerbi-bridge-tool
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
