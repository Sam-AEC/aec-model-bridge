<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AEC Model Bridge</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="brand-mark" viewBox="0 0 96 96">
        <rect width="96" height="96" rx="20" fill="#111923"/>
        <g stroke="#111923" stroke-width="2.5" stroke-linejoin="round">
          <polygon fill="#1CB5CA" points="48,16 76,32 48,48 20,32"/>
          <polygon fill="#FFFFFF" points="20,32 48,48 48,80 20,64"/>
          <polygon fill="#AEBCCB" points="48,48 76,32 76,64 48,80"/>
        </g>
        <path fill="#111923" transform="matrix(28,16,0,32,20,32)" d="M0.24,1.02 V0.66 A0.26,0.26 0 0 1 0.76,0.66 V1.02 Z"/>
        <path fill="#111923" transform="matrix(28,-16,0,32,48,48)" d="M0.24,1.02 V0.66 A0.26,0.26 0 0 1 0.76,0.66 V1.02 Z"/>
        <rect x="0.5" y="0.5" width="95" height="95" rx="19.5" fill="none" stroke="rgba(255,255,255,0.16)"/>
      </symbol>
      <symbol id="nav-chat" viewBox="0 0 32 32">
        <path class="o f" d="M5 5h22a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H15l-6 5v-5H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/>
        <path class="a" d="M9 11h14M9 16h8"/>
      </symbol>
      <symbol id="nav-plans" viewBox="0 0 32 32">
        <rect class="o f" x="6" y="3" width="20" height="26" rx="2"/>
        <path class="o" d="M10.5 9.5h11M10.5 14.5h11"/>
        <path class="a" d="M10.5 20h6"/>
      </symbol>
      <symbol id="nav-findings" viewBox="0 0 32 32">
        <path class="o f" d="M14 2l11 6-11 6-11-6z"/>
        <path class="o" d="M3 8l11 6v12L3 20zM14 14l11-6v12l-11 6z"/>
        <circle class="b" cx="23" cy="23" r="7"/>
        <path class="c" d="M19.6 23l2.4 2.4 4.2-4.6"/>
      </symbol>
      <symbol id="nav-reports" viewBox="0 0 32 32">
        <rect class="o f" x="6" y="3" width="20" height="26" rx="2"/>
        <path class="o" d="M10.5 8.5h11"/>
        <rect class="fa" x="10.5" y="18" width="3.4" height="7" rx=".5"/>
        <rect class="fa" x="15.3" y="14" width="3.4" height="11" rx=".5"/>
        <rect class="fi" x="20.1" y="11" width="3.4" height="14" rx=".5"/>
      </symbol>
      <symbol id="nav-log" viewBox="0 0 32 32">
        <rect class="o f" x="3" y="5" width="26" height="22" rx="2"/>
        <path class="a" d="M8.5 12l5 4-5 4"/>
        <path class="o" d="M16.5 21h7"/>
      </symbol>
      <symbol id="nav-settings" viewBox="0 0 32 32">
        <path class="o" stroke-width="3.2" d="M16 3v5M16 24v5M3 16h5M24 16h5M6.8 6.8l3.5 3.5M21.7 21.7l3.5 3.5M25.2 6.8l-3.5 3.5M10.3 21.7l-3.5 3.5"/>
        <circle class="o f" cx="16" cy="16" r="9"/>
        <circle class="a" cx="16" cy="16" r="3.4"/>
      </symbol>
    </defs>
  </svg>

  <aside class="rail" aria-label="Primary">
    <div class="brand" title="AEC Model Bridge" aria-label="AEC Model Bridge">
      <svg class="brand-mark" width="36" height="36" aria-hidden="true"><use href="#brand-mark"/></svg>
    </div>
    <button class="nav is-active" aria-current="page" type="button" data-view="chat" title="Chat" aria-label="Chat">
      <svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><use href="#nav-chat"/></svg>
      <span class="nav-label">Chat</span>
    </button>
    <button class="nav" type="button" data-view="plans" title="Plans" aria-label="Plans">
      <svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><use href="#nav-plans"/></svg>
      <span class="nav-label">Plans</span>
    </button>
    <button class="nav" type="button" data-view="findings" title="Findings" aria-label="Findings">
      <svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><use href="#nav-findings"/></svg>
      <span class="nav-label">Findings</span>
    </button>
    <button class="nav" type="button" data-view="reports" title="Reports" aria-label="Reports">
      <svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><use href="#nav-reports"/></svg>
      <span class="nav-label">Reports</span>
    </button>
    <button class="nav" type="button" data-view="log" title="Run Log" aria-label="Run Log">
      <svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><use href="#nav-log"/></svg>
      <span class="nav-label">Log</span>
    </button>
    <button class="nav" type="button" data-view="settings" title="Settings" aria-label="Settings">
      <svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><use href="#nav-settings"/></svg>
      <span class="nav-label">Settings</span>
    </button>
  </aside>

  <main class="app" aria-label="AEC Model Bridge">
    <header class="topbar">
      <div class="titleblock">
        <span class="view-tile" aria-hidden="true"><svg class="ico" viewBox="0 0 32 32"><use id="view-icon" href="#nav-chat"/></svg></span>
        <div>
          <h1 id="view-title">Chat</h1>
          <p id="view-subtitle">AEC Model Bridge</p>
        </div>
      </div>
      <div class="status-pill" role="status" id="host-status">
        <span class="dot"></span>
        <span>Host pending</span>
      </div>
    </header>
    <div class="alerts" id="system-alerts" aria-live="polite" hidden></div>

    <section class="setup" id="setup-check" aria-labelledby="setup-title" data-state="checking">
      <div class="setup-head">
        <h2 id="setup-title" class="setup-title">Setup check</h2>
        <span class="setup-status" id="setup-status" role="status" aria-live="polite">Checking setup&hellip;</span>
        <button type="button" id="setup-toggle" aria-expanded="false" aria-controls="setup-list" hidden>Details</button>
        <button type="button" id="setup-refresh" aria-label="Refresh setup check">Refresh</button>
      </div>
      <ol class="setup-list" id="setup-list" hidden></ol>
    </section>

    <section class="view is-active" id="view-chat" aria-labelledby="view-title">
      <div class="chat-feed" id="chat-feed" role="log" aria-live="polite" aria-label="Conversation"></div>
      <form class="composer" id="chat-form" aria-label="Send a message">
        <select id="chat-provider" aria-label="Agent">
          <option value="claude">Claude</option>
          <option value="codex">Codex</option>
        </select>
        <input id="chat-input" name="message" autocomplete="off" aria-label="Message to the agent" placeholder="Ask about the active model">
        <button type="submit" class="primary">Send</button>
        <button type="button" id="chat-reset" title="Start a new conversation" aria-label="Start a new conversation">New</button>
      </form>
    </section>

    <section class="view" id="view-plans" aria-labelledby="view-title">
      <div class="toolbar">
        <button type="button" data-action="refresh-plans" aria-label="Refresh pending plans">Refresh</button>
        <button type="button" class="primary" data-action="approve-selected" aria-label="Approve selected plans" aria-describedby="plan-select-hint">Approve Selected</button>
        <span class="sr-only" id="plan-select-hint">Tick the checkbox on one or more pending plans first.</span>
      </div>
      <div class="list" id="plan-list" role="group" aria-label="Pending plans"></div>
    </section>

    <section class="view" id="view-findings" aria-labelledby="view-title">
      <div class="toolbar">
        <button type="button" class="primary" data-action="run-health">Run Health Check</button>
        <select id="severity-filter" aria-label="Severity">
          <option value="all">All severities</option>
          <option value="error">Errors</option>
          <option value="warning">Warnings</option>
          <option value="info">Info</option>
        </select>
      </div>
      <div class="list" id="finding-list" role="group" aria-label="Findings"></div>
    </section>

    <section class="view" id="view-reports" aria-labelledby="view-title">
      <div class="toolbar">
        <button type="button" class="primary" data-action="export-excel">Export Excel</button>
        <button type="button" data-action="refresh-reports" aria-label="Refresh reports list">Refresh</button>
      </div>
      <div class="list" id="report-list" role="group" aria-label="Reports"></div>
    </section>

    <section class="view" id="view-log" aria-labelledby="view-title">
      <div class="timeline" id="run-log" role="group" aria-label="Run log"></div>
    </section>

    <section class="view" id="view-settings" aria-labelledby="view-title">
      <form class="settings" id="settings-form">
        <label>
          Hub URL
          <input id="hub-url" value="http://127.0.0.1:3000">
        </label>
        <label>
          Approval Mode
          <select id="approval-mode">
            <option value="required">Required</option>
            <option value="auto">Auto</option>
          </select>
        </label>
        <button type="submit" class="primary">Save</button>
      </form>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
