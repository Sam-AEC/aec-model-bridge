ShortDescription: Revit MCP server and add-in. AI clients read and edit Revit models through plans that a person approves.
Description: |-
  AEC Model Bridge is a Model Context Protocol (MCP) server with a native Autodesk Revit add-in.
  MCP clients such as Claude, Codex and Cursor read the open Revit model and propose changes as plans.
  Nothing in the model changes until a person approves a plan in the Revit panel.
  The installer adds the add-in for Revit 2024 to 2027 and a bundled Python with the MCP server.
  Autodesk Revit is required and is not installed by this package.
