# Documentation site. Build: pip install -r docs/requirements.txt, then
# mkdocs build --strict. .github/workflows/docs.yml builds it on pull requests and
# deploys it to GitHub Pages from main.
site_name: AEC Model Bridge
site_description: Revit MCP server with a native Revit add-in. AI clients read and edit BIM models through plans a person approves.
site_url: https://sam-aec.github.io/aec-model-bridge/
repo_url: https://github.com/Sam-AEC/aec-model-bridge
repo_name: Sam-AEC/aec-model-bridge
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Links from docs/ to repository files outside docs/ become GitHub links.
hooks:
  - scripts/mkdocs_hooks.py

# Not part of the site: translated READMEs (rendered on GitHub, checked by tests),
# design prototypes, recipe scripts and the docs build requirements.
exclude_docs: |
  i18n/
  design/
  recipes/
  diagrams/
  requirements.txt

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search

